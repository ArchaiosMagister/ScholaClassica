# Configuración de las funciones docentes de Supabase.
# El puente de Palabra del día se despliega EN SU PROPIO proyecto.
# Login: UUID y contraseña en Supabase Auth, sin JWT previo.
[functions.schola-login]
verify_jwt = false

# La bandeja sí requiere un JWT de usuario; además comprueba su AAL2 y UUID.
[functions.schola-inbox]
verify_jwt = true

# Se sirve desde el proyecto independiente de Palabra del día; JWT externo.
# La propia función valida la sesión con getUser() y exige el nivel aal2.
[functions.schola-palabra-inbox]
verify_jwt = false

# Administración de Vocabula: JWT + UUID docente + aal2 en cada operación.
[functions.schola-vocab-admin]
verify_jwt = true
