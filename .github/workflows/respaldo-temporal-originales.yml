# Respaldo de historial completo de los tres orígenes públicos.
# Solo la rama temporal de auditoría. Sin despliegue ni permisos de escritura.
name: Auditoría puntual de respaldos de repositorios originales
on:
  push:
    branches: [audit/retiro-originales-20261119]
permissions:
  contents: read
jobs:
  copias-restaurables:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Descargar script de auditoría de rutas
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Clonar tres orígenes enteros y comprobar SHAs docentes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backups
          while read -r name expected; do
            [[ -z "$name" ]] && continue
            git clone --mirror "https://github.com/ArchaiosMagister/${name}.git" "$RUNNER_TEMP/${name}.git"
            actual="$(git --git-dir="$RUNNER_TEMP/${name}.git" rev-parse refs/heads/main)"
            if [[ "$actual" != "$expected" ]]; then
              echo "El origen de ${name} cambió: ${actual}; se esperaba ${expected}"
              exit 1
            fi
            git --git-dir="$RUNNER_TEMP/${name}.git" bundle create "$GITHUB_WORKSPACE/backups/${name}.bundle" --all
            git --git-dir="$RUNNER_TEMP/${name}.git" bundle verify "$GITHUB_WORKSPACE/backups/${name}.bundle"
            git bundle list-heads "$GITHUB_WORKSPACE/backups/${name}.bundle" | grep -Fq "$expected refs/heads/main"
            git clone "$GITHUB_WORKSPACE/backups/${name}.bundle" "$RUNNER_TEMP/${name}-restaurado"
            git -C "$RUNNER_TEMP/${name}-restaurado" fsck --full
            restored="$(git -C "$RUNNER_TEMP/${name}-restaurado" rev-parse HEAD)"
            test "$restored" = "$expected"
            echo "${name}: bundle verificado, clon restaurado y SHA correcto."
          done <<'SNAPSHOTS'
          Appendix-grammaticae 40d06bff955087d81c5b3ab502422d77caf3186a
          VocabulaLatinaGraecaque 6c51743b7b065e6afdd77468a3d61de29d48f2d4
          EvolucionFonetica 5a464a2c67f6dbc3bd6f6a7c45e862dc6af71349
          SNAPSHOTS
          cd backups
          sha256sum *.bundle > SHA256SUMS.txt
          cat > LEEME-RESTAURACION.txt <<'DOC'
          RESPALDOS DE GIT COMPLETOS — ScholaClassica, 2026-11-19

          Contenido: tres archivos *.bundle, cada uno con historial y referencias Git
          del repositorio original. Se han validado los SHAs de main.

          Para verificar las descargas y reconstruir Appendix en un directorio nuevo:
            sha256sum -c SHA256SUMS.txt
            git clone Appendix-grammaticae.bundle Appendix-restaurado
            cd Appendix-restaurado
            git fsck --full
            git log --oneline -3

          git bundle verify requiere un repositorio Git: el clon + fsck anterior
          ofrece una comprobación restaurable sin ese requisito previo.

          Para restaurar en un remoto, crear un repositorio vacío y revisar
          manualmente las referencias antes de hacer git push --mirror.

          IMPORTANTE: Los bundles NO incluyen datos de Supabase, votos,
          sesiones, ni localStorage/cachés del alumnado. Tampoco los archivos
          externos de Git LFS (si existieran), wikis, issues, releases o ajustes
          de configuración y Secrets de GitHub.
          Los tres bundles también se clonan automáticamente y se verifican con
          git fsck --full en el workflow antes de su entrega.
          La conservación de estos bundles en Actions es temporal: DESCARGAR
          y GUARDAR en un lugar seguro ANTES de archivar originales.
          DOC
          ls -lh *.bundle SHA256SUMS.txt
      - name: Archivar respaldos Git verificables para descarga privada de mantenimiento
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-integral-origenes-20261119
          path: backups/
          if-no-files-found: error
          retention-days: 30

      - name: Verificar HTTP de rutas históricas y destinos nuevos (solo lectura)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p backups
          printf 'etiqueta\turl\tcodigo_http\ttipo_contenido\tbytes\n' > backups/urls-verificadas.tsv
          fallos=0
          while IFS='|' read -r etiqueta url; do
            [[ -z "$etiqueta" ]] && continue
            resultado="$(curl -sSL --retry 2 --connect-timeout 10 --max-time 35 -o /tmp/respuesta-scholaclassica -w '%{http_code}\t%{content_type}\t%{size_download}' "$url")"
            estado=$?
            if [[ "$estado" -ne 0 ]]; then
              printf '%s\t%s\tERROR-CURL-%s\tN/D\t0\n' "$etiqueta" "$url" "$estado" | tee -a backups/urls-verificadas.tsv
              fallos=$((fallos+1))
            else
              printf '%s\t%s\t%s\n' "$etiqueta" "$url" "$resultado" | tee -a backups/urls-verificadas.tsv
              codigo="${resultado%%$'\t'*}"
              [[ "$codigo" == 200 ]] || fallos=$((fallos+1))
            fi
          done <<'URLS'
          appendix-home|https://archaiosmagister.github.io/Appendix-grammaticae/
          appendix-val|https://archaiosmagister.github.io/Appendix-grammaticae/val/index.html
          appendix-griego-vocativos|https://archaiosmagister.github.io/Appendix-grammaticae/griego-sustantivos.html
          vocabula-home|https://archaiosmagister.github.io/VocabulaLatinaGraecaque/
          evolutio-home|https://archaiosmagister.github.io/EvolucionFonetica/
          evolutio-manifest|https://archaiosmagister.github.io/EvolucionFonetica/manifest.webmanifest
          evolutio-sw|https://archaiosmagister.github.io/EvolucionFonetica/sw.js
          schola-home|https://archaiosmagister.github.io/ScholaClassica/
          schola-gramatica|https://archaiosmagister.github.io/ScholaClassica/apps/gramatica/index.html
          schola-gramatica-val|https://archaiosmagister.github.io/ScholaClassica/apps/gramatica/val/index.html
          schola-vocabula|https://archaiosmagister.github.io/ScholaClassica/apps/vocabulario/index.html
          schola-evolutio|https://archaiosmagister.github.io/ScholaClassica/apps/evolucion-fonetica/index.html
          schola-evolutio-manifest|https://archaiosmagister.github.io/ScholaClassica/apps/evolucion-fonetica/manifest.webmanifest
          schola-evolutio-sw|https://archaiosmagister.github.io/ScholaClassica/apps/evolucion-fonetica/sw.js
          URLS
          echo "Rutas verificadas: $(($(wc -l < backups/urls-verificadas.tsv)-1)); errores HTTP/transporte: $fallos"
          test "$fallos" -eq 0
      - name: Verificar que los avisos publicados no redirigen ni anulan otras cachés
        shell: bash
        run: |
          set -euo pipefail
          base=https://archaiosmagister.github.io
          curl -fsSL --retry 2 "$base/Appendix-grammaticae/assets/theme.js" |
            grep -F 'SCHOLA_LEGACY_NOTICE_V1' >/dev/null
          curl -fsSL --retry 2 "$base/VocabulaLatinaGraecaque/theme.js" |
            grep -Fq 'SCHOLA_LEGACY_NOTICE_V1'
          curl -fsSL --retry 2 "$base/EvolucionFonetica/index.html" |
            grep -F 'schola-legacy-notice' >/dev/null
          curl -fsSL --retry 2 "$base/EvolucionFonetica/sw.js" |
            grep -F 'key.startsWith(CACHE_PREFIX)' >/dev/null
          echo 'Avisos antiguos HTTPS y aislamiento de caché comprobados.'
      - name: Contrastar todas las 90 rutas de Appendix y los accesos antiguos
        run: node scripts/audit-legacy-routes.mjs
      - name: Archivar mapa exhaustivo de URL antiguas y nuevas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-exhaustiva-95-enlaces-legados
          path: |
            backups/conciliacion-enlaces-exhaustiva.json
            backups/conciliacion-enlaces-exhaustiva.tsv
          if-no-files-found: warn
          retention-days: 30
      - name: Guardar resultados HTTP para revisión de retirada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-http-enlaces-legados-20261119
          path: backups/urls-verificadas.tsv
          if-no-files-found: warn
          retention-days: 30
