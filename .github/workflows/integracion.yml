name: Validar integración sin publicar
on:
  push:
    branches: [main, 'integracion/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scholaclassica-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Código de ScholaClassica
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtener Appendix original en commit fijado (solo lectura)
        uses: actions/checkout@v4
        with:
          repository: ArchaiosMagister/Appendix-grammaticae
          ref: a3d54209b3bb8a31efd3d57d62b09d6de8d85f5c
          path: .sources/appendix
          persist-credentials: false
      - name: Obtener Evolutio original en commit fijado (solo lectura)
        uses: actions/checkout@v4
        with:
          repository: ArchaiosMagister/EvolucionFonetica
          ref: 0897aae01b6d4c905aafa1c1a6bac5af0810c812
          path: .sources/evolutio
          persist-credentials: false
      - name: Obtener Vocabula original en commit fijado (solo lectura)
        uses: actions/checkout@v4
        with:
          repository: ArchaiosMagister/VocabulaLatinaGraecaque
          ref: 0e16505b7631298a0448c4160a5d258f82732bfe
          path: .sources/vocabula
          persist-credentials: false
      - name: Validar núcleo léxico de Vocabula original (entorno CommonJS aislado)
        run: |
          mkdir -p "$RUNNER_TEMP/vocabula-original"
          cp -a .sources/vocabula/. "$RUNNER_TEMP/vocabula-original/"
          cd "$RUNNER_TEMP/vocabula-original"
          node tests/check-vocabulary-scope.cjs
          node tests/check-vocabulary-provenance.cjs
      - name: Validar Evolutio original
        working-directory: .sources/evolutio
        run: npm test
      - name: Validar Appendix original
        working-directory: .sources/appendix
        run: node scripts/validate-site.mjs
      - name: Auditar esquema y candidatos de Etymologicon sin habilitar respuestas
        run: npm run etymology:audit
      - name: Conciliar el Excel docente de Etymologicon con sus comprobaciones
        run: npm run etymology:compile
      - name: Construir ScholaClassica sin despliegue
        run: npm run build
      - name: Preparar artefacto docente separado y desactivado (sin desplegar)
        run: npm run build:docente
      - name: Comprobar copia exacta, enlaces y aislamiento de herramientas docentes
        run: npm test
      - name: Preparar Chromium para prueba de navegación
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar navegación, PWA offline y aislamiento de cachés en Chromium
        run: npm run test:browser
      - name: Probar Vocabula integrado en Chromium con servicio simulado
        run: npm run test:browser:vocabula
      - name: Probar inicio de sesión, TOTP y bloqueo de avisos en Chromium simulado
        run: npm run test:browser:docente
      - name: Archivar catálogo académico para inspección (sin publicar la webapp)
        uses: actions/upload-artifact@v4
        with:
          name: etymologicon-gr1-auditoria-docente
          path: build/etymologicon/gr1-audited.json
          retention-days: 7
      - name: Archivar resultado de construcción como artefacto de pruebas (sin desplegar)
        uses: actions/upload-artifact@v4
        with:
          name: scholaclassica-integracion-fase2
          path: dist/
          if-no-files-found: error
          retention-days: 7
