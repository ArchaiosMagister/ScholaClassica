name: Validar y publicar ScholaClassica en GitHub Pages
on:
  push:
    branches: [main, 'integracion/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scholaclassica-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Código de ScholaClassica
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtener Appendix original en commit fijado (solo lectura)
        uses: actions/checkout@v4
        with:
          repository: ArchaiosMagister/Appendix-grammaticae
          ref: a3d54209b3bb8a31efd3d57d62b09d6de8d85f5c
          path: .sources/appendix
          persist-credentials: false
      - name: Obtener Evolutio original en commit fijado (solo lectura)
        uses: actions/checkout@v4
        with:
          repository: ArchaiosMagister/EvolucionFonetica
          ref: 901dacb125ee7894ea9d11faf7b0d0afa7e713b5
          path: .sources/evolutio
          persist-credentials: false
      - name: Obtener Vocabula original en commit fijado (solo lectura)
        uses: actions/checkout@v4
        with:
          repository: ArchaiosMagister/VocabulaLatinaGraecaque
          ref: 0e16505b7631298a0448c4160a5d258f82732bfe
          path: .sources/vocabula
          persist-credentials: false
      - name: Obtener el banco lexicográfico de GeneradorExamenes (solo lectura)
        uses: actions/checkout@v4
        with:
          repository: ArchaiosMagister/GeneradorExamenes
          ref: 31bd9c8bf1bf8d1be434a15fcb32239564f5f1d9
          path: .sources/examenes
          persist-credentials: false
      - name: Validar núcleo léxico de Vocabula original (entorno CommonJS aislado)
        run: |
          mkdir -p "$RUNNER_TEMP/vocabula-original"
          cp -a .sources/vocabula/. "$RUNNER_TEMP/vocabula-original/"
          cd "$RUNNER_TEMP/vocabula-original"
          node tests/check-vocabulary-scope.cjs
          node tests/check-vocabulary-provenance.cjs
      - name: Validar Evolutio original
        working-directory: .sources/evolutio
        run: npm test
      - name: Validar Appendix original
        working-directory: .sources/appendix
        run: node scripts/validate-site.mjs
      - name: Auditar esquema y candidatos de Etymologicon sin habilitar respuestas
        run: npm run etymology:audit
      - name: Conciliar el Excel docente de Etymologicon con sus comprobaciones
        run: npm run etymology:compile
      - name: Construir ScholaClassica sin despliegue
        run: npm run build
      - name: Preparar artefacto docente separado y desactivado (sin desplegar)
        run: npm run build:docente
      - name: Auditar paquete estático de Cloudflare Pages sin publicación
        run: npm run audit:docente:cloudflare
      - name: Comprobar copia exacta, enlaces y aislamiento de herramientas docentes
        run: npm test
      - name: Auditoría de seguridad antes de publicar
        run: npm run audit:publicacion
      - name: Preparar Chromium para prueba de navegación
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar navegación, PWA offline y aislamiento de cachés en Chromium
        run: npm run test:browser
      - name: Probar despliegue en la subruta real de GitHub Pages
        run: npm run test:browser:pages
      - name: Probar morfología curricular, corrección y caché offline
        run: npm run test:browser:morfologia
      - name: Probar producción escrita, teclado griego y repaso local sin conexión
        run: npm run test:browser:morfologia:activa
      - name: Probar Vocabula integrado en Chromium con servicio simulado
        run: npm run test:browser:vocabula
      - name: Probar inicio de sesión, TOTP y bloqueo de avisos en Chromium simulado
        run: npm run test:browser:docente
      - name: Archivar catálogo íntegro de nombres, pruebas y pendientes (sin publicar)
        uses: actions/upload-artifact@v4
        with:
          name: morfologia-auditoria-nominal-completa
          path: |
            build/morfologia/auditoria-sustantivos-griegos.json
            build/morfologia/auditoria-sustantivos-latinos.json
            build/morfologia/catalogo-nominal-total.json
            build/morfologia/contraste-nominal-secundario.json
            build/morfologia/paradigmas-preparados-sin-unidad.json
          if-no-files-found: error
          retention-days: 14
      - name: Archivar catálogo académico para inspección (sin publicar la webapp)
        uses: actions/upload-artifact@v4
        with:
          name: etymologicon-gr1-auditoria-docente
          path: build/etymologicon/gr1-audited.json
          retention-days: 7
      - name: Archivar resultado de construcción como artefacto de pruebas (sin desplegar)
        uses: actions/upload-artifact@v4
        with:
          name: scholaclassica-integracion-fase2
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Preparar artefacto GitHub Pages solo en main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  publicar:
    name: Publicar ScholaClassica (solo tras validación en main)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validar
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Comprobar que GitHub Pages está activado
        uses: actions/configure-pages@v5
      - name: Publicar únicamente el artefacto validado
        id: deployment
        uses: actions/deploy-pages@v4
