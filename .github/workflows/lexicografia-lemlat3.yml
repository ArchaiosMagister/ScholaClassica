name: Latín II - contraste independiente LEMLAT3 (solo auditoría)

on:
  pull_request:
    paths:
      - '.github/workflows/lexicografia-lemlat3.yml'
      - 'scripts/lemlat3-latin2.mjs'
      - 'scripts/lexicografia-latin2.mjs'
      - 'scripts/audit-latin2-lexicography.mjs'
      - 'tests/lemlat3-latin2.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lemlat3:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: ScholaClassica sin credenciales persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Appendix fijado (solo compilación)
        uses: actions/checkout@v4
        with:
          repository: ArchaiosMagister/Appendix-grammaticae
          ref: a3d54209b3bb8a31efd3d57d62b09d6de8d85f5c
          path: .sources/appendix
          persist-credentials: false
      - name: Evolutio fijado (solo compilación)
        uses: actions/checkout@v4
        with:
          repository: ArchaiosMagister/EvolucionFonetica
          ref: 901dacb125ee7894ea9d11faf7b0d0afa7e713b5
          path: .sources/evolutio
          persist-credentials: false
      - name: Vocabula fijado (solo compilación)
        uses: actions/checkout@v4
        with:
          repository: ArchaiosMagister/VocabulaLatinaGraecaque
          ref: 0e16505b7631298a0448c4160a5d258f82732bfe
          path: .sources/vocabula
          persist-credentials: false
      - name: UniMorph Latin en revisión inmutable (fuente primera)
        uses: actions/checkout@v4
        with:
          repository: unimorph/lat
          ref: 050924c9f013e6aba4d7c87be243a1d79b6c5b10
          path: .sources/unimorph-latin
          persist-credentials: false
      - name: LEMLAT3 en revisión inmutable (fuente independiente, CC BY-NC-SA 4.0)
        uses: actions/checkout@v4
        with:
          repository: CIRCSE/LEMLAT3
          ref: e8328948fb4b9b73b625aeda3639137c5e49a1ff
          path: .sources/lemlat3
          persist-credentials: false
      - name: Construir banco de Latín II fuera de Pages
        run: npm run build
      - name: Probar convertidor y reglas de evidencia
        run: node --test tests/lexicografia-latin2.test.mjs tests/lemlat3-latin2.test.mjs
      - name: Preparar formas simples prioritarias PAU y cuaderno
        run: node scripts/lemlat3-latin2.mjs prepare
      - name: Instalar biblioteca de base de datos requerida por el ejecutable LEMLAT3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmariadbd19
      - name: Ejecutar CLI oficial LEMLAT3 sobre entradas priorizadas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/academic-audits/latin2-lexicon/runtime
          tar --no-same-owner -xzf .sources/lemlat3/bin/linux_embedded_64.tar.gz \
            -C build/academic-audits/latin2-lexicon/runtime
          cd build/academic-audits/latin2-lexicon/runtime/linux_embedded
          chmod u+x ./lemlat
          ./lemlat -s 0 -i "$GITHUB_WORKSPACE/build/academic-audits/latin2-lexicon/lemlat-input.txt" \
            -x "$GITHUB_WORKSPACE/build/academic-audits/latin2-lexicon/lemlat-result.xml"
      - name: Convertir XML real y registrar entradas sin cobertura
        run: node scripts/lemlat3-latin2.mjs convert
      - name: Contrastar UniMorph y LEMLAT sin alterar el banco
        run: npm run lexicografia:lat2 -- --independent build/academic-audits/latin2-lexicon/lemlat-evidencias.jsonl
      - name: Impedir que los informes entren en la web del alumnado
        shell: bash
        run: |
          set -euo pipefail
          test -f build/academic-audits/latin2-lexicon/lemlat-resumen.json
          test ! -e dist/academic-audits
          test ! -e dist/lemlat-evidencias.jsonl
          node -e 'const f=require("fs");const x=JSON.parse(f.readFileSync("build/academic-audits/latin2-lexicon/resumen.json"));if(x.independentSourceCount!==2||x.individuallyVerified!==false)process.exit(1)'
      - name: Archivar únicamente informes docentes independientes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latin2-lemlat3-cotejo-prioritario
          path: |
            build/academic-audits/latin2-lexicon/lemlat-manifest.json
            build/academic-audits/latin2-lexicon/lemlat-resumen.json
            build/academic-audits/latin2-lexicon/lemlat-evidencias.jsonl
            build/academic-audits/latin2-lexicon/resumen.json
            build/academic-audits/latin2-lexicon/evidencias.ndjson
            build/academic-audits/latin2-lexicon/revision-prioritaria.tsv
          if-no-files-found: warn
          retention-days: 30
