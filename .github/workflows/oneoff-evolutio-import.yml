# One-shot import from a frozen public source commit. Deletes itself.
name: Importar fuente completa Evolutio una vez
on:
  push:
    branches: [feature/autonomia-evolutio-20261119]
permissions:
  contents: write
jobs:
  importar:
    if: github.repository == 'ArchaiosMagister/ScholaClassica' && github.ref == 'refs/heads/feature/autonomia-evolutio-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Rama de migracion
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Fuente castellana de Evolutio en revision inmutable
        uses: actions/checkout@v4
        with:
          repository: ArchaiosMagister/EvolucionFonetica
          ref: 901dacb125ee7894ea9d11faf7b0d0afa7e713b5
          path: .source-import/evolutio
          persist-credentials: false
      - name: Importar bytes originales y retirar workflow privilegiado
        shell: bash
        run: |
          set -euo pipefail
          test ! -e vendor/evolutio
          test "$(git -C .source-import/evolutio rev-parse HEAD)" = "901dacb125ee7894ea9d11faf7b0d0afa7e713b5"
          test "$(git -C .source-import/evolutio rev-parse HEAD^{tree})" = "91fb41736365ab4bd4f81ca8b265ceb765907354"
          mkdir -p vendor/evolutio
          cp -a .source-import/evolutio/. vendor/evolutio/
          rm -rf vendor/evolutio/.git
          git add -A vendor/evolutio
          git rm .github/workflows/oneoff-evolutio-import.yml
          staged="$(git write-tree)"
          actual="$(git rev-parse "${staged}:vendor/evolutio")"
          test "$actual" = "91fb41736365ab4bd4f81ca8b265ceb765907354"
          count="$(git ls-tree -r --name-only "$actual" | wc -l | tr -d ' ')"
          test "$count" = "53"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Importar 53 ficheros exactos de Evolutio y retirar importador"
          git push origin HEAD:refs/heads/feature/autonomia-evolutio-20261119
